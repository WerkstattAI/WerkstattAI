<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WerkstattAI - Direktannahme</title>
  <style>
    :root{
      --bg:#0b1324;
      --card:#121c33;
      --line:rgba(255,255,255,.12);
      --text:#e7edf7;
      --muted:#9cadc5;
      --accent:#60a5fa;
      --accent-2:#22c55e;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(37,99,235,.40), transparent 60%),
        radial-gradient(700px 360px at 90% 0%, rgba(34,197,94,.18), transparent 60%),
        linear-gradient(140deg,#08111f,#121d35 45%,#0a1223);
      min-height:100vh;
    }
    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:24px;
    }
    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:18px;
      flex-wrap:wrap;
    }
    .back{
      color:var(--text);
      text-decoration:none;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 12px;
      background:rgba(255,255,255,.06);
      font-weight:700;
    }
    .card{
      border:1px solid var(--line);
      border-radius:18px;
      background:linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.05));
      box-shadow:0 20px 50px rgba(0,0,0,.35);
      padding:18px;
    }
    h1{
      margin:0;
      font-size:30px;
      letter-spacing:.2px;
    }
    .sub{
      margin-top:6px;
      color:var(--muted);
      font-size:14px;
    }
    form{
      margin-top:18px;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
    }
    .full{grid-column:1/-1}
    label{
      display:block;
      font-size:12px;
      color:#c6d3e6;
      font-weight:800;
      letter-spacing:.04em;
      margin-bottom:6px;
      text-transform:uppercase;
    }
    input,select,textarea,button{
      width:100%;
      min-height:44px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(7,14,27,.72);
      color:var(--text);
      padding:10px 12px;
      outline:none;
    }
    textarea{min-height:110px;resize:vertical}
    input:focus,select:focus,textarea:focus{
      border-color:rgba(96,165,250,.45);
      box-shadow:0 0 0 3px rgba(96,165,250,.12);
    }
    .actions{
      grid-column:1/-1;
      display:flex;
      gap:10px;
      justify-content:flex-end;
      margin-top:8px;
    }
    .btn{
      min-width:180px;
      font-weight:800;
      cursor:pointer;
    }
    .btn.save{
      background:linear-gradient(180deg, rgba(96,165,250,.28), rgba(96,165,250,.12));
      border-color:rgba(96,165,250,.38);
    }
    .btn.cancel{
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:1px solid var(--line);
      background:rgba(255,255,255,.05);
      color:var(--text);
    }
    @media (max-width: 860px){
      form{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="back" href="/dashboard?workshop_id={{ workshop_id }}">Zurück zum Dashboard</a>
    </div>

    <section class="card">
      <h1>Direktannahme</h1>
      <div class="sub">Ticket manuell erfassen, wenn der Kunde direkt in der Werkstatt ist.</div>

      <form method="post" action="/dashboard/intake">
        <input type="hidden" name="workshop_id" value="{{ workshop_id }}" />

        <div>
          <label for="fahrzeug">Fahrzeug</label>
          <input id="fahrzeug" name="fahrzeug" placeholder="z.B. VW Golf" required />
        </div>

        <div>
          <label for="baujahr">Baujahr</label>
          <input id="baujahr" name="baujahr" placeholder="z.B. 2018" />
        </div>

        <div>
          <label for="kilometerstand">Kilometerstand</label>
          <input id="kilometerstand" name="kilometerstand" placeholder="z.B. 95000" />
        </div>

        <div>
          <label for="telefon">Telefon</label>
          <input id="telefon" name="telefon" placeholder="z.B. 0176 12345678" />
        </div>

        <div>
          <label for="name">Name</label>
          <input id="name" name="name" placeholder="z.B. Max Mustermann" />
        </div>

        <div>
          <label for="request_type">Typ</label>
          <select id="request_type" name="request_type">
            <option value="diagnose">Diagnose</option>
            <option value="service">Service</option>
            <option value="notfall">Notfall</option>
            <option value="kostenvoranschlag">Kostenvoranschlag</option>
          </select>
        </div>

        <div>
          <label for="priority">Priorität</label>
          <select id="priority" name="priority">
            <option value="normal">Normal</option>
            <option value="hoch">Hoch</option>
            <option value="niedrig">Niedrig</option>
          </select>
        </div>

        <div>
          <label for="fahrbereit">Fahrbereit</label>
          <select id="fahrbereit" name="fahrbereit">
            <option value="">Nicht angegeben</option>
            <option value="ja">Ja</option>
            <option value="nein">Nein</option>
          </select>
        </div>

        <div>
          <label for="abschleppdienst">Abschleppdienst</label>
          <select id="abschleppdienst" name="abschleppdienst">
            <option value="">Nicht angegeben</option>
            <option value="ja">Ja</option>
            <option value="nein">Nein</option>
          </select>
        </div>

        <div class="full">
          <label for="problem">Anliegen</label>
          <textarea id="problem" name="problem" placeholder="Kurz das Problem oder den Auftrag beschreiben..." required></textarea>
        </div>

        <div class="actions">
          <a class="btn cancel" href="/dashboard?workshop_id={{ workshop_id }}">Abbrechen</a>
          <button class="btn save" type="submit">Ticket speichern</button>
        </div>
      </form>
    </section>
  </div>
</body>
</html>
