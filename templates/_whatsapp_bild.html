{% if nachricht.bild_url %}
<figure class="kundenfoto" data-kundenfoto>
  <a href="{{ nachricht.bild_url }}" target="_blank" rel="noopener noreferrer" data-bild-oeffnen aria-label="Foto in voller Größe öffnen">
    <img src="{{ nachricht.bild_url }}" alt="{{ 'Foto aus der Business-App' if nachricht.direction == 'outbound' else 'Vom Kunden gesendetes Foto' }}" loading="lazy" width="320" height="200" />
  </a>
  <p class="bild-fehler" hidden>Foto gerade nicht verfügbar. Öffnen Sie die Bildansicht für weitere Informationen.</p>
  <figcaption><a href="{{ nachricht.bild_url }}" target="_blank" rel="noopener noreferrer" data-bild-oeffnen>Bild öffnen</a> · Nur für Ihre Werkstatt sichtbar</figcaption>
</figure>
{% endif %}
