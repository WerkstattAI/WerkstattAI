<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WerkstattAI - Login</title>
  <style>
    :root{
      --bg:#09111f;
      --panel:#101a31;
      --line:rgba(255,255,255,.14);
      --text:#e8eef8;
      --muted:#aebbd0;
      --info:#60a5fa;
      --danger:#ef4444;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255,255,255,.03) 1px, transparent 1px),
        radial-gradient(900px 420px at 8% -10%, rgba(37,99,235,.32), transparent 64%),
        linear-gradient(135deg, #08111f 0%, #0d182b 50%, #090f1c 100%);
      background-size:44px 44px,44px 44px,auto,auto;
    }

    .login{
      width:min(420px,100%);
      border:1px solid var(--line);
      border-radius:18px;
      padding:24px;
      background:rgba(16,26,49,.92);
      box-shadow:0 24px 70px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.08);
    }

    .eyebrow{
      display:inline-flex;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.07);
      color:#dbeafe;
      font-size:11px;
      font-weight:900;
      letter-spacing:.05em;
      text-transform:uppercase;
    }

    h1{
      margin:14px 0 6px 0;
      font-size:30px;
      line-height:1.15;
    }

    .sub{
      margin:0 0 20px 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    label{
      display:block;
      margin:12px 0 6px 0;
      color:#dbe5f2;
      font-size:12px;
      font-weight:800;
    }

    input,button{
      width:100%;
      min-height:44px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(7,14,27,.78);
      color:var(--text);
      padding:10px 12px;
      outline:none;
      font:inherit;
    }

    input:focus{
      border-color:rgba(96,165,250,.45);
      box-shadow:0 0 0 3px rgba(96,165,250,.12);
    }

    button{
      margin-top:16px;
      cursor:pointer;
      font-weight:900;
      background:linear-gradient(180deg, rgba(96,165,250,.30), rgba(96,165,250,.14));
    }

    .error{
      margin:14px 0 0 0;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(239,68,68,.32);
      background:rgba(239,68,68,.12);
      color:#fecaca;
      font-size:13px;
      font-weight:750;
    }
  </style>
</head>
<body>
  <main class="login">
    <div class="eyebrow">WerkstattAI Intern</div>
    <h1>Anmelden</h1>
    <p class="sub">Zugriff auf Dashboard, Tickets und Werkstattdaten.</p>

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next or '/dashboard' }}" />

      <label for="email">E-Mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus />

      <label for="password">Passwort</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit">Einloggen</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
  </main>
</body>
</html>
